    ║    └── logo.png   ← file logo di sini                       ║
    ║                                                              ║
    ║  Jika logo ada di subfolder:                                 ║

    ║                                                              ║

    <!--
      src="logo.png" → GANTI dengan nama file logo kamu
      ─────────────────────────────────────────────────
      1. Siapkan file PNG logo (disarankan background transparan)
      2. Beri nama: logo.png  (atau logo.jpg, logo.svg)
      3. Upload ke repo GitHub sejajar index.html:
            nama-repo/
            ├── index.html

      Jika logo di subfolder → src="images/logo.png"

<!-- ── SCRIPT ── -->
<script>
  document.getElementById("year").textContent = new Date().getFullYear();
  /* ================================================================
     ⚙️  KONFIGURASI UTAMA — WAJIB DIUBAH SEBELUM DEPLOY
     ================================================================ */
  const ADMIN_WA  = '6283166144481'; // ← Nomor WA admin tanpa + dan spasi
  const TOKO_NAMA = 'YRGNstore';          // ← Nama toko

  /* ================================================================
     📄  JUMLAH PRODUK PER HALAMAN
         Ganti angka di bawah untuk mengubah berapa produk yang
         ditampilkan per halaman. Default: 8
     ================================================================ */
  const PRODUCTS_PER_PAGE = 6;

  /* ================================================================
     🛍️  DATA PRODUK
     ================================================================
     Setiap produk adalah satu objek {} di dalam array.
     Salin-tempel blok {} untuk menambah produk baru.

     Penjelasan setiap field:
       id        → angka unik, jangan ada yang sama
       name      → nama produk
       desc      → deskripsi singkat
       price     → harga (angka, tanpa titik/koma)
       stock     → jumlah stok
       category  → nama kategori BEBAS DIISI, mis: 'Tas', 'Sepatu', 'Aksesoris'
                   ⬆ Tombol filter kategori dibuat OTOMATIS dari field ini!
       badge     → 'hot' (merah) | 'new' (biru) | null (tanpa badge)
       badgeText → teks label, mis: '🔥 Terlaris' atau '✨ Baru'
       img       → URL foto produk (Imgur, imgBB, Google Drive publik, dll.)
     ================================================================ */
  const products = [
    {
      id: 1,
      name: 'Mukadua 1',
      desc: 'Ada harga ada kualitas',
      price: 115000,
      stock: 20,
      category: 'Baju',
      badge: 'new',
      badgeText: '🔥 Baru',
      img: 'MUKADUA 1.png',
    },

    {
      id: 2,
      name: 'Mukadua 2',
      desc: 'Ada harga ada kualitas',
      price: 115000,
      stock: 20,
      category: 'Baju',
      badge: 'new',
      badgeText: '🔥 Baru',
      img: 'MUKADUA 2.png',
    },
   
  ];

  /* ================================================================
     💰  FORMAT HARGA — Mengubah angka menjadi "Rp 125.000"
     ================================================================ */
  const fmt = n => 'Rp ' + n.toLocaleString('id-ID');

  /* ================================================================
     🔍  STATE FILTER
         Menyimpan kategori aktif dan kata kunci pencarian saat ini
     ================================================================ */
  let activeCategory = 'Semua'; // kategori yang sedang aktif
  let searchQuery    = '';      // kata kunci dari search bar
  let currentPage    = 1;       // halaman yang sedang aktif (mulai dari 1)

  /* ================================================================
     🏷️  RENDER TOMBOL KATEGORI
         Tombol dibuat otomatis dari field category di setiap produk.
         Cukup tambah category baru di data produk, tombol muncul sendiri!
     ================================================================ */
  function renderCategories() {
    // Kumpulkan semua kategori unik, tambahkan "Semua" di posisi pertama
    const cats = ['Semua', ...new Set(products.map(p => p.category))];
    document.getElementById('catWrap').innerHTML = cats.map(cat => `
      <button
        class="cat-pill ${cat === activeCategory ? 'active' : ''}"
        onclick="setCategory('${cat}')"
      >${cat}</button>
    `).join('');
  }

  /* ================================================================
     🖼️  RENDER KARTU PRODUK
         Menyaring produk berdasarkan kategori + kata kunci,
         lalu memotong hasilnya sesuai halaman aktif (currentPage).
     ================================================================ */
  function renderProducts() {
    const q    = searchQuery.toLowerCase().trim();
    const grid = document.getElementById('productGrid');

    // Filter produk berdasarkan kategori DAN kata kunci pencarian
    const filtered = products.filter(p => {
      const matchCat    = activeCategory === 'Semua' || p.category === activeCategory;
      const matchSearch = !q ||
        p.name.toLowerCase().includes(q) ||
        p.desc.toLowerCase().includes(q) ||
        p.category.toLowerCase().includes(q);
      return matchCat && matchSearch;
    });

    // Hitung total halaman
    const totalPages = Math.ceil(filtered.length / PRODUCTS_PER_PAGE);

    // Pastikan currentPage tidak melebihi total halaman
    if (currentPage > totalPages) currentPage = Math.max(1, totalPages);

    // Potong array sesuai halaman aktif
    const start   = (currentPage - 1) * PRODUCTS_PER_PAGE;
    const paged   = filtered.slice(start, start + PRODUCTS_PER_PAGE);

    // Update label jumlah produk
    const showing = paged.length;
    const total   = filtered.length;
    document.getElementById('countLabel').textContent =
      total === 0     ? '' :
      total === products.length
        ? `${total} produk`
        : `${total} dari ${products.length} produk`;

    // Tampilkan pesan kosong jika tidak ada hasil
    if (filtered.length === 0) {
      grid.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🔍</div>
          <h3>Produk tidak ditemukan</h3>
          <p>Coba kata kunci lain atau pilih kategori yang berbeda.</p>
        </div>`;
      renderPagination(0, 0);
      return;
    }

    // SVG ikon WhatsApp (dipakai ulang di setiap tombol beli)
    const waSvg = `<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>`;

    // Render kartu produk untuk halaman aktif saja
    grid.innerHTML = paged.map(p => `
      <div class="card" id="card-${p.id}">
        <div class="card-img-wrap">
          <img src="${p.img}" alt="${p.name}" loading="lazy" />
          ${p.badge ? `<span class="badge ${p.badge}">${p.badgeText}</span>` : ''}
          <span class="cat-badge">${p.category}</span>
        </div>
        <div class="card-body">
          <div class="card-name">${p.name}</div>
          <div class="card-desc">${p.desc}</div>
          <div class="card-meta">
            <span class="card-price">${fmt(p.price)}</span>
            <span class="card-stock">Stok: ${p.stock}</span>
          </div>
          <button class="btn-buy" onclick="beli(${p.id})">
            ${waSvg} Beli via WhatsApp
          </button>
        </div>
      </div>
    `).join('');

    // Render kontrol pagination
    renderPagination(currentPage, totalPages);
  }

  /* ================================================================
     📄  RENDER PAGINATION
         Membuat tombol Prev, nomor halaman, dan Next.
         Muncul otomatis hanya jika ada lebih dari 1 halaman.
         Nomor halaman yang panjang ditampilkan dengan "..." di tengah.
     ================================================================ */
  function renderPagination(page, total) {
    const el = document.getElementById('pagination');

    // Sembunyikan pagination jika hanya 1 halaman atau kosong
    if (total <= 1) { el.classList.add('hidden'); el.innerHTML = ''; return; }
    el.classList.remove('hidden');

    // Tentukan nomor halaman yang ditampilkan (dengan titik "...")
    // Selalu tampilkan: halaman 1, halaman terakhir, halaman aktif ±1
    const pages = [];
    for (let i = 1; i <= total; i++) {
      if (i === 1 || i === total || (i >= page - 1 && i <= page + 1)) {
        pages.push(i);
      }
    }
    // Sisipkan '...' di antara lompatan angka
    const withDots = [];
    pages.forEach((p, idx) => {
      if (idx > 0 && p - pages[idx - 1] > 1) withDots.push('...');
      withDots.push(p);
    });

    // SVG panah kiri & kanan
    const iconPrev = `<svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>`;
    const iconNext = `<svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>`;

    el.innerHTML =
      // Tombol Prev
      `<button class="pg-btn" onclick="goPage(${page - 1})" ${page === 1 ? 'disabled' : ''}>
        ${iconPrev}<span>Sebelumnya</span>
       </button>` +
      // Nomor halaman
      withDots.map(p =>
        p === '...'
          ? `<span class="pg-dots">…</span>`
          : `<button class="pg-num ${p === page ? 'active' : ''}" onclick="goPage(${p})">${p}</button>`
      ).join('') +
      // Tombol Next
      `<button class="pg-btn" onclick="goPage(${page + 1})" ${page === total ? 'disabled' : ''}>
        <span>Berikutnya</span>${iconNext}
       </button>`;
  }

  /* ================================================================
     ➡️  PINDAH HALAMAN — Dipanggil saat tombol pagination diklik
         Setelah ganti halaman, scroll ke atas section produk
     ================================================================ */
  function goPage(page) {
    currentPage = page;
    renderProducts();
    // Scroll halus ke atas bagian produk
    document.getElementById('produk').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* ================================================================
     🏷️  SET KATEGORI — Dipanggil saat tombol kategori diklik
     ================================================================ */
  /* ================================================================
     🏷️  SET KATEGORI — Dipanggil saat tombol kategori diklik
         Reset ke halaman 1 saat kategori berubah
     ================================================================ */
  function setCategory(cat) {
    activeCategory = cat;
    currentPage    = 1;         // ← Kembali ke halaman 1
    renderCategories();
    renderProducts();
  }

  /* ================================================================
     🔍  LIVE SEARCH — Dipanggil setiap ketikan di kotak pencarian
         Pencarian berlaku bersamaan dengan filter kategori aktif
     ================================================================ */
  /* ================================================================
     🔍  LIVE SEARCH — Reset ke halaman 1 setiap kali kata kunci berubah
     ================================================================ */
  document.getElementById('searchInput').addEventListener('input', function () {
    searchQuery = this.value;
    currentPage = 1;   // ← Kembali ke halaman 1 saat mengetik
    renderProducts();
  });

  /* ================================================================
     📲  FUNGSI BELI — Buka WhatsApp dengan pesan produk otomatis
         Pesan berisi: nama produk, kategori, dan harga
     ================================================================ */
  function beli(id) {
    const p = products.find(x => x.id === id);
    if (!p) return;

    const msg = encodeURIComponent(
      `Halo Admin ${TOKO_NAMA} 👋\n\n` +
      `Saya ingin memesan:\n` +
      `🛍️ *${p.name}*\n` +
      `🏷️ Kategori: ${p.category}\n` +
      `💰 Harga: ${fmt(p.price)}\n\n` +
      `Mohon informasi ketersediaan dan cara pembayarannya. Terima kasih!`
    );

    showToast('Mengarahkan ke WhatsApp...');
    setTimeout(() => {
      window.open(`https://wa.me/${ADMIN_WA}?text=${msg}`, '_blank');
    }, 600);
  }

  /* ================================================================
     🔔  TOAST NOTIFIKASI — Muncul sementara di bawah layar
     ================================================================ */
  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = '✓ ' + msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
  }

  /* ================================================================
     🚀  INISIALISASI — Jalankan saat halaman pertama kali dibuka
     ================================================================ */
  renderCategories(); // Buat tombol kategori
  renderProducts();   // Tampilkan semua produk
</script>
</body>
