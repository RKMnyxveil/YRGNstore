<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YRGN22 — Belanja Mudah & Cepat</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css"/>

</head>
<body>

  <!-- NAV -->
  <nav>
    <a class="nav-logo" href="#">
      <img class="nav-logo-img" src="Logo.png" alt="YRGNstore Logo" onerror="this.classList.add('error')" />
      <span class="nav-logo-name"><span class="brand">YRGN</span><span class="sub">store</span></span>
    </a>
    <a class="nav-wa" href="https://wa.me/6283166144481?text=Halo%2C%20saya%20ingin%20bertanya%20tentang%20produk" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Chat Admin
    </a>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <h1>Produk Berkualitas<br>Harga Bersahabat</h1>
    <p>Pembelian langsung melalui WhatsApp</p>
  </section>

  <!-- TOOLBAR -->
  <div class="toolbar" id="produk">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="6"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Cari nama produk, kategori..." autocomplete="off" />
    </div>
    <div class="cat-wrap" id="catWrap"></div>
  </div>

  <!-- PRODUCTS -->
  <section class="section">
    <div class="section-header">
      <h2 class="section-title">Produk Kami</h2>
      <span class="section-count" id="countLabel"></span>
    </div>
    <div class="grid" id="productGrid"></div>
    <div class="pagination hidden" id="pagination"></div>
  </section>

  <!-- CTA BANNER -->
  <div class="banner">
    <div class="banner-text">
      <h2>Ada yang ingin ditanyakan?</h2>
      <p>Tim admin siap bantu informasi stok & detail produk.</p>
    </div>
    <a class="banner-btn" href="https://wa.me/6283166144481?text=Halo%2C%20saya%20ingin%20bertanya" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Hubungi Admin
    </a>
  </div>

  <!-- FOOTER -->
  <footer>
    <p>© <span id="year"></span> <strong>YRGN</strong> · Store</p>
  </footer>

  <!-- TOAST -->
  <div id="toast">✓ Mengarahkan ke WhatsApp...</div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const ADMIN_WA  = '6283166144481';
    const TOKO_NAMA = 'YRGNstore';
    const PRODUCTS_PER_PAGE = 6;

    // === Data produk dengan ukuran tunggal "Oversize" ===
    const products = [
      {
        id: 1,
        name: 'Mukadua 1',
        desc: 'Ada harga ada kualitas',
        price: 115000,
        stock: 20,                // total stok
        category: 'Baju',
        badgeText: '🔥 BARU',
        img: 'MUKADUA 1.png',
        size: 'Oversize',         // <— cukup string saja
      },
      {
        id: 2,
        name: 'Mukadua 2',
        desc: 'Ada harga ada kualitas',
        price: 115000,
        stock: 10,
        category: 'Baju',
        badgeText: '🔥 BARU',
        img: 'MUKADUA 2.png',
        size: 'Oversize',
      },
      {
        id: 3,
        name: 'Krem & Putih Geometrik Life Coach',
        desc: 'Ada harga ada kualitas',
        price: 95000,
        stock: 6,
        category: 'Baju',
        badgeText: '🔥 BARU',
        img: 'Krem & Putih Geometrik Life Coach.png',
        size: 'Oversize',
      },
    ];

    const fmt = n => 'Rp ' + n.toLocaleString('id-ID');

    let activeCategory = 'Semua';
    let searchQuery    = '';
    let currentPage    = 1;

    function renderCategories() {
      const cats = ['Semua', ...new Set(products.map(p => p.category))];
      document.getElementById('catWrap').innerHTML = cats.map(cat => `
        <button class="cat-pill ${cat === activeCategory ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>
      `).join('');
    }

    function filterProducts() {
      const q = searchQuery.toLowerCase().trim();
      return products.filter(p => {
        const matchCat    = activeCategory === 'Semua' || p.category === activeCategory;
        const matchSearch = !q || p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q) || p.category.toLowerCase().includes(q);
        return matchCat && matchSearch;
      });
    }

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      const filtered = filterProducts();

      const totalPages = Math.ceil(filtered.length / PRODUCTS_PER_PAGE) || 1;
      if (currentPage > totalPages) currentPage = Math.max(1, totalPages);
      const start = (currentPage - 1) * PRODUCTS_PER_PAGE;
      const paged = filtered.slice(start, start + PRODUCTS_PER_PAGE);

      const total = filtered.length;
      document.getElementById('countLabel').textContent =
        total === 0 ? '' : (total === products.length ? `${total} produk` : `${total} dari ${products.length} produk`);

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)">
            <div style="font-size:3rem;margin-bottom:12px;">🔍</div>
            <h3 style="font-family:'Playfair Display',serif;font-size:1.2rem;margin-bottom:6px;color:var(--ink);">Produk tidak ditemukan</h3>
            <p style="font-size:.9rem;line-height:1.6">Coba kata kunci lain atau pilih kategori yang berbeda.</p>
          </div>`;
        renderPagination(0,0);
        return;
      }

      const waSvg = `<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>`;

      grid.innerHTML = paged.map(p=>{
        // Status stok sederhana
        const stockClass = p.stock<=0 ? 'color:#ef4444' : (p.stock<=3 ? 'color:#ca8a04' : 'color:#059669');
        const stockText  = p.stock<=0 ? 'Stok habis' : (p.stock<=3 ? 'Stok menipis' : 'Stok tersedia');

        return `
          <div class="card" id="card-${p.id}">
            <div class="card-img-wrap">
              <img src="${p.img}" alt="${p.name}" loading="lazy" />
              <span class="badge">${p.badgeText || 'BARU'}</span>
              <span class="cat-badge">${p.category}</span>
            </div>
            <div class="card-body">
              <div class="card-name">${p.name}</div>
              <div class="card-desc">${p.desc}</div>

              <!-- Ukuran tunggal -->
              <div class="single-size" title="Ukuran kaos">
                <span class="label">Ukuran</span>
                <span class="value">${p.size || 'Oversize'}</span>
              </div>

              <div class="card-meta">
                <span class="card-price">${fmt(p.price)}</span>
                <span class="card-stock" style="${stockClass}">${stockText}</span>
              </div>

              <button class="btn-buy" onclick="beli(${p.id})">
                ${waSvg} Beli via WhatsApp
              </button>
            </div>
          </div>
        `;
      }).join('');

      renderPagination(currentPage, Math.ceil(filtered.length / PRODUCTS_PER_PAGE) || 1);
    }

    function renderPagination(page,total){
      const el = document.getElementById('pagination');
      if(total<=1){el.classList.add('hidden');el.innerHTML='';return;}
      el.classList.remove('hidden');

      const pages=[];
      for(let i=1;i<=total;i++){ if(i===1||i===total||(i>=page-1 && i<=page+1)) pages.push(i); }
      const withDots=[];
      pages.forEach((p,idx)=>{ if(idx>0 && p-pages[idx-1]>1) withDots.push('...'); withDots.push(p); });

      const iconPrev = `<svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      const iconNext = `<svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

      el.innerHTML =
        `<button class="pg-btn" onclick="goPage(${page-1})" ${page===1?'disabled':''}>${iconPrev}<span>Sebelumnya</span></button>`+
        withDots.map(p=>p==='...' ? `<span class="pg-dots">…</span>` : `<button class="pg-num ${p===page?'active':''}" onclick="goPage(${p})">${p}</button>`).join('')+
        `<button class="pg-btn" onclick="goPage(${page+1})" ${page===total?'disabled':''}><span>Berikutnya</span>${iconNext}</button>`;
    }

    function goPage(page){
      currentPage = page;
      renderProducts();
      document.getElementById('produk').scrollIntoView({behavior:'smooth',block:'start'});
    }

    function setCategory(cat){
      activeCategory = cat;
      currentPage = 1;
      renderCategories();
      renderProducts();
    }

    document.getElementById('searchInput').addEventListener('input',function(){
      searchQuery = this.value;
      currentPage = 1;
      renderProducts();
    });

    // Beli via WA (otomatis pakai ukuran Oversize)
    window.beli = function(id){
      const p = products.find(x=>x.id===id);
      if(!p) return;

      const msg = encodeURIComponent(
        `Halo Admin ${TOKO_NAMA} 👋\n\n`+
        `Saya ingin memesan:\n`+
        `🛍️ *${p.name}*\n`+
        `📏 Ukuran: ${p.size || 'Oversize'}\n`+
        `🏷️ Kategori: ${p.category}\n`+
        `💰 Harga: ${fmt(p.price)}\n\n`+
        `Mohon informasi ketersediaan dan cara pembayarannya. Terima kasih!`
      );

      showToast('Mengarahkan ke WhatsApp...');
      setTimeout(()=>{ window.open(`https://wa.me/${ADMIN_WA}?text=${msg}`,'_blank','noopener'); },500);
    }

    let toastTimer;
    function showToast(msg){
      const t=document.getElementById('toast');
      t.textContent='✓ '+msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer=setTimeout(()=>t.classList.remove('show'),2400);
    }

    // Init
    renderCategories();
    renderProducts();
  </script>
</body>
</html>
